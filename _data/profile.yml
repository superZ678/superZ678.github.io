# Basic profile
name: Ting Zhe
avatar: assets/images/photo_zt.png
bio: >
  I am a Ph.D. candidate in Artificial Intelligence, School of Computer Science, Wuhan University, advised by Prof. Yong Luo.
  My research interests include computer vision, deep learning, video understanding, fine‑grained hand‑action understanding, multimodal modeling and LVLM.
  I received my M.S. degree in Electronic and Communication Engineering from Fuzhou University.

  I am always looking for research collaborations. Feel free to contact me via email.

