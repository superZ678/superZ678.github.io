short_bio: >-
  <p>
    I am a Ph.D. candidate in Artificial Intelligence at the School of Computer Science, <strong>Wuhan University</strong>, advised by Prof. <strong>Yong Luo</strong>. My research focuses on <strong>computer vision</strong>, <strong>video understanding</strong>, <strong>fine-grained hand-action understanding</strong>, <strong>multimodal learning</strong>, and <strong>LVLMs</strong>.
  </p>
  <p>
    Before joining Wuhan University, I received my M.S. degree in Electronics and Communication Engineering from <strong>Fuzhou University</strong> and worked as a Linux Systems R&amp;D Engineer. I welcome research collaborations in fine-grained visual understanding and multimodal reasoning.
  </p>

