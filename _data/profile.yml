short_bio: >-
  <p>
    I am a Ph.D. candidate in Artificial Intelligence at the School of Computer Science, Wuhan University, advised by Prof. Yong Luo. My research focuses on computer vision, video understanding, fine-grained hand-action understanding, multimodal learning, and large vision-language models.
  </p>
  <p>
    Before joining Wuhan University, I received my M.S. degree in Electronics and Communication Engineering from Fuzhou University and worked as a Linux Systems R&amp;D Engineer. I welcome research collaborations in fine-grained visual understanding and multimodal reasoning.
  </p>

