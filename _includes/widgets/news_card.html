{% assign news_items = site.news | sort: "date" | reverse | slice: 0, include.limit -%}

<section class="academic-section">
    <h2 class="section-heading"><i class="fas fa-rss" aria-hidden="true"></i> News</h2>
    <div class="news-list">
        {% for item in news_items %}
        <div class="news-entry">
            <time>{{ item.date | date: "%b %Y" }}</time>
            <div>{{ item.title }}</div>
        </div>
        {% endfor %}
    </div>
</section>
