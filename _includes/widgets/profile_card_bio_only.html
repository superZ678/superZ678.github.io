<section class="academic-section about-section">
    <h1 class="section-heading">About Me</h1>
    <div class="text-profile-bio" {% if site.data.profile.short_bio_text_justify %}style="text-align: justify;"{% endif %}>
        {{ site.data.profile.short_bio }}
    </div>
    {% if site.data.profile.cv_link %}
    <a class="text-link" href="{{ site.data.profile.cv_link | relative_url }}">
        <i class="fas fa-file-lines"></i> View Curriculum Vitae
    </a>
    {% endif %}
</section>
